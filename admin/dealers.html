<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dealer applications — VoltHub Admin</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body data-base="../"><div id="admin-app"></div><script src="../assets/js/data.js"></script><script src="../assets/js/profiles.js"></script><script src="../assets/js/store.js"></script><script src="../assets/js/ui.js"></script><script src="../assets/js/admin.js"></script>
<script>
  const root=Admin.mount('dealers','Dealer applications','Review business details before granting quantity pricing.');
  if(root) {
    let filter='all';
    function render() {
      const all=Store.dealerApplications(),rows=all.filter(a=>filter==='all'||a.status===filter).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
      root.innerHTML=Admin.demoBanner()+`<div class="kpis">${['Pending','Approved','Rejected'].map(status=>`<div class="kpi"><div class="kpi-top">${status} applications</div><div class="kpi-value">${all.filter(a=>a.status===status).length}</div><div class="kpi-foot">${status==='Approved'?'Dealer prices active':status==='Pending'?'Waiting for admin review':'Can correct details and reapply'}</div></div>`).join('')}<div class="kpi"><div class="kpi-top">Bulk invitation</div><div class="kpi-value">&gt;100 units</div><div class="kpi-foot">Optional · regular orders are still allowed</div></div></div>
        <div class="card" style="margin-bottom:22px"><div class="card-head"><div><h3>Dealer order minimum</h3><p>Optional item subtotal before coupons, tax and delivery. Retail customers are unaffected.</p></div><a class="link" href="products.html">Set product rules →</a></div><form id="dealer-settings" class="admin-toolbar"><div class="field"><label for="order-minimum">Minimum dealer order value (RM)</label><input class="input" id="order-minimum" type="number" min="0" step="0.01" required value="${Store.wholesaleSettings().minimumOrderValue}"></div><button class="btn btn-primary btn-sm" type="submit">Save minimum</button><span class="muted" style="font-size:12px">Set 0 for no store-wide minimum. Product minimums still apply.</span></form></div>
        <div class="admin-toolbar"><label for="application-filter">Application status</label><select class="select" id="application-filter"><option value="all">All applications</option>${['Pending','Approved','Rejected'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select><a href="../dealer.html" class="link" target="_blank" rel="noopener">View customer application page ↗</a></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Business</th><th>Contact</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${UI.esc(a.company)}</b><br><small class="muted">${UI.esc(a.id)} · ${UI.esc(a.businessType)}</small></td><td>${UI.esc(a.contact)}<br><small>${UI.esc(a.email)}</small></td><td>${Store.formatDate(a.submittedAt)}</td><td>${UI.statusBadge(a.status)}</td><td><button class="btn btn-outline btn-sm" data-review="${UI.esc(a.id)}">Review</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="padding:35px;text-align:center">No applications in this view. Customers can apply from Dealer access on the storefront.</td></tr>'}</tbody></table></div></div>`;
      root.querySelector('#application-filter').addEventListener('change',e=>{filter=e.target.value;render();});
      root.querySelector('#dealer-settings').addEventListener('submit',e=>{e.preventDefault();const result=Store.saveWholesaleSettings({minimumOrderValue:root.querySelector('#order-minimum').value});UI.toast(result.ok?'Dealer order minimum saved':result.msg,result.ok?'success':'error');});
      root.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>review(b.dataset.review)));
    }
    function review(id) {
      const a=Store.dealerApplications().find(a=>a.id===id);if(!a)return;
      const fields=[['company','Business'],['registration','Registration'],['contact','Contact'],['email','Business email'],['phone','Phone'],['businessType','Business type'],['accountEmail','Customer account'],['address','Business address'],['notes','Expected orders / notes']];
      const modal=UI.openModal(`<h2>Review dealer application</h2><p class="muted">${UI.esc(a.id)} · ${UI.esc(a.status)}</p><dl class="dealer-review-grid">${fields.map(([key,label])=>`<div class="${['address','notes'].includes(key)?'full':''}"><dt>${label}</dt><dd>${UI.esc(a[key] || '—')}</dd></div>`).join('')}</dl><div class="field"><label for="review-note">Note for the applicant</label><textarea class="textarea" id="review-note" maxlength="2000" placeholder="Optional approval note or reason for declining">${UI.esc(a.reviewNote)}</textarea></div><p class="hint" style="margin-top:12px">Approval activates dealer rules on configured products. Declining an approved account removes its dealer access for future orders. Existing orders keep their recorded prices.</p><div class="dealer-action-row"><button class="btn btn-primary" id="approve-dealer">Approve dealer</button><button class="btn btn-outline" id="reject-dealer">${a.status==='Approved'?'Revoke access':'Decline application'}</button><button class="btn btn-ghost" id="close-review">Close</button></div>`,{wide:true});
      const save=status=>{const result=Store.reviewDealerApplication(id,status,modal.querySelector('#review-note').value);if(!result.ok){UI.toast(result.msg,'error');return;}UI.closeModal();render();UI.toast(status==='Approved'?'Dealer access approved':'Application declined; dealer access inactive');};
      modal.querySelector('#approve-dealer').addEventListener('click',()=>save('Approved'));
      modal.querySelector('#reject-dealer').addEventListener('click',()=>save('Rejected'));
      modal.querySelector('#close-review').addEventListener('click',UI.closeModal);
    }
    window.addEventListener('storage',e=>{if(e.key===Store.storagePrefix+'dealers')render();});render();
  }
</script></body></html>
