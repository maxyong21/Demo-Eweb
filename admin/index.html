<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — VoltHub Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-base="../">
  <div id="admin-app"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    const root = Admin.mount('dashboard', 'Dashboard', 'Welcome back! Here is what is happening with your store.');
    if (root) render();

    function render() {
      const I = UI.ICONS;
      const orders = Store.orders();
      const products = Store.products();
      const valid = orders.filter((o) => o.status !== 'Cancelled');
      const revenue = valid.reduce((s, o) => s + o.total, 0);
      const DAY = 86400000;
      const startOf = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
      const today = startOf(Date.now());
      const sumRange = (from, to) => valid.filter((o) => { const t = new Date(o.createdAt).getTime(); return t >= from && t < to; }).reduce((s, o) => s + o.total, 0);
      const last7 = sumRange(today - 6 * DAY, today + DAY);
      const prev7 = sumRange(today - 13 * DAY, today - 6 * DAY);
      const trend = prev7 ? Math.round(((last7 - prev7) / prev7) * 100) : 100;
      const customers = new Set(orders.map((o) => o.customerId || o.email)).size;
      const low = products.filter((p) => p.stock < 10);
      const units = valid.reduce((s, o) => s + o.items.reduce((n, i) => n + i.qty, 0), 0);

      // Daily revenue for last 14 days
      const days = [];
      for (let i = 13; i >= 0; i--) {
        const from = today - i * DAY;
        days.push({ from, value: sumRange(from, from + DAY), count: valid.filter((o) => { const t = new Date(o.createdAt).getTime(); return t >= from && t < from + DAY; }).length });
      }

      // Status breakdown
      const statusColors = { Pending: '#d97706', Processing: '#2563eb', Shipped: '#7c3aed', Delivered: '#16a34a', Cancelled: '#dc2626' };
      const statusCounts = Object.keys(statusColors).map((s) => [s, orders.filter((o) => o.status === s).length]);
      const maxStatus = Math.max(1, ...statusCounts.map((x) => x[1]));

      // Top products by units
      const sold = {};
      valid.forEach((o) => o.items.forEach((i) => { sold[i.id] = sold[i.id] || { qty: 0, revenue: 0, item: i }; sold[i.id].qty += i.qty; sold[i.id].revenue += i.qty * i.price; }));
      const top = Object.values(sold).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

      root.innerHTML = `
        ${Admin.demoBanner()}
        <div class="kpis">
          <div class="kpi"><div class="kpi-top">Total Revenue<span class="kpi-ic ic-blue">${I.dollar}</span></div><div class="kpi-value">${Store.formatRM(revenue)}</div><div class="kpi-foot"><span class="${trend >= 0 ? 'up' : 'stock-out'}">${trend >= 0 ? '▲' : '▼'} ${Math.abs(trend)}%</span> last 7 days vs previous</div></div>
          <div class="kpi"><div class="kpi-top">Orders<span class="kpi-ic ic-purple">${I.box}</span></div><div class="kpi-value">${orders.length}</div><div class="kpi-foot">${orders.filter((o) => o.status === 'Pending').length} pending · ${units} units sold</div></div>
          <div class="kpi"><div class="kpi-top">Avg. Order Value<span class="kpi-ic ic-green">${I.chart}</span></div><div class="kpi-value">${Store.formatRM(valid.length ? revenue / valid.length : 0)}</div><div class="kpi-foot">${customers} unique customers</div></div>
          <div class="kpi"><div class="kpi-top">Low Stock<span class="kpi-ic ic-orange">${I.alert}</span></div><div class="kpi-value">${low.length}</div><div class="kpi-foot">${low.length ? 'Products below 10 units' : 'All products well stocked'}</div></div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-head"><div><h3>Sales — last 14 days</h3><p>Daily revenue excluding cancelled orders</p></div><b>${Store.formatRM(days.reduce((s, d) => s + d.value, 0))}</b></div>
            <div class="chart">${chart(days)}</div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3>Orders by status</h3><p>All time</p></div></div>
            <div class="status-bars">${statusCounts.map(([s, n]) => `<div class="sb-row"><span>${s}</span><div class="sb-track"><div class="sb-fill" style="width:${(n / maxStatus) * 100}%;background:${statusColors[s]}"></div></div><b style="text-align:right">${n}</b></div>`).join('')}</div>
            <div class="card-head" style="margin:26px 0 14px"><div><h3>Low stock alert</h3></div><a href="products.html" class="link" style="font-size:13px">Manage</a></div>
            <div class="top-list">${low.length ? low.slice(0, 4).map((p) => `<div class="top-item"><div class="cart-thumb">${UI.art(p)}</div><div class="ti-main"><b>${UI.esc(p.name)}</b><small>${p.id}</small></div><span class="ti-val ${p.stock === 0 ? 'stock-out' : 'stock-low'}">${p.stock} left</span></div>`).join('') : '<p class="muted" style="font-size:14px">Nothing to restock.</p>'}</div>
          </div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-head"><div><h3>Recent orders</h3></div><a href="orders.html" class="link" style="font-size:13px">View all →</a></div>
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Status</th><th class="num">Total</th></tr></thead>
                <tbody>${orders.slice(0, 7).map((o) => `<tr style="cursor:pointer" data-order="${o.id}"><td><b>${o.id}</b></td><td>${UI.esc(o.customerName)}</td><td>${Store.formatDate(o.createdAt)}</td><td>${UI.statusBadge(o.status)}</td><td class="num"><b>${Store.formatRM(o.total)}</b></td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3>Top products</h3><p>By revenue</p></div></div>
            <div class="top-list">${top.map((t) => `<div class="top-item"><div class="cart-thumb">${UI.art(t.item)}</div><div class="ti-main"><b>${UI.esc(t.item.name)}</b><small>${t.qty} sold</small></div><span class="ti-val">${Store.formatRM(t.revenue)}</span></div>`).join('')}</div>
          </div>
        </div>`;

      root.querySelectorAll('[data-order]').forEach((tr) => tr.addEventListener('click', () => Admin.orderModal(tr.dataset.order, render)));
      // Bring hovered bar to front so its tooltip is never covered by neighbouring bars
      root.querySelectorAll('.bar-g').forEach((g) => g.addEventListener('mouseenter', () => { if (g.nextSibling) g.parentNode.appendChild(g); }));
    }

    function chart(days) {
      const W = 700, H = 260, L = 56, R = 8, T = 16, B = 30;
      const max = Math.max(...days.map((d) => d.value), 1000);
      // Round tick step (1, 2, 2.5 or 5 × 10ⁿ) so axis labels read cleanly
      const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
      const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
      const ticks = Math.ceil(max / step);
      const top = step * ticks;
      const bw = (W - L - R) / days.length;
      const y = (v) => T + (H - T - B) * (1 - v / top);
      let grid = '';
      for (let i = 0; i <= ticks; i++) {
        const v = step * i;
        grid += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : v}</text>`;
      }
      const bars = days.map((d, i) => {
        const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = Math.max(d.value ? 3 : 0, H - B - y(d.value));
        const label = new Date(d.from).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
        const tipX = Math.min(Math.max(x + w / 2, L + 60), W - 70);
        return `<g class="bar-g">
          <rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>
          <rect class="bar ${i === days.length - 1 ? 'today' : ''}" x="${x}" y="${H - B - h}" width="${w}" height="${h}" rx="5"/>
          ${i % 2 === days.length % 2 || i === days.length - 1 ? `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${i === days.length - 1 ? 'Today' : label}</text>` : ''}
          <g class="tip"><rect x="${tipX - 62}" y="${Math.max(0, H - B - h - 52)}" width="124" height="42" rx="8" fill="#0f172a"/><text x="${tipX}" y="${Math.max(0, H - B - h - 52) + 18}" text-anchor="middle" style="fill:#fff;font-weight:700">${Store.formatRM(d.value)}</text><text x="${tipX}" y="${Math.max(0, H - B - h - 52) + 33}" text-anchor="middle" style="fill:#94a3b8">${label} · ${d.count} order${d.count === 1 ? '' : 's'}</text></g>
        </g>`;
      }).join('');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily revenue chart">${grid}${bars}</svg>`;
    }
  </script>
</body>
</html>
