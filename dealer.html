<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dealer access — VoltHub</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body data-base=""><div id="site-header"></div><main class="container"><div class="page-head"><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Dealer access</span></div><h1>Wholesale & dealer access</h1><p class="muted">Apply once. Wait for approval. Access the quantity prices set by this store.</p></div><div id="dealer-page" class="dealer-form"></div></main><div id="site-footer"></div>
<script src="assets/js/data.js"></script><script src="assets/js/profiles.js"></script><script src="assets/js/store.js"></script><script src="assets/js/ui.js"></script>
<script>
  UI.renderHeader('dealer');UI.renderFooter();
  const root=document.getElementById('dealer-page');
  function renderDealer() {
    const u=Store.user(), application=Store.dealerApplication();
    const example=Store.products().find(p=>p.dealerExample);
    const explainer=`<div class="dealer-panel"><h3>How it works</h3><p>Regular customers can order from 1 unit at retail prices. Orders above 100 total units—or more than 100 of one item—receive an optional invitation to apply.</p><p>Dealer prices start only after admin approval. Each product can have its own minimum quantity, pack increment and quantity price breaks. Products without dealer rules keep their regular price and quantity rules.</p><p>Retail coupons do not stack with dealer-priced items. Quantities and stock are checked again before an order is placed.</p>${example?`<a class="link" href="product.html?id=${UI.esc(example.id)}">Try the dealer-pricing example →</a>`:''}</div>`;
    if(!u || u.role!=='customer') {
      root.innerHTML=explainer+`<div class="panel"><h2>Sign in as a customer to apply</h2><p class="muted" style="margin:15px 0">Use the demo customer account: user / user123.</p><a class="btn btn-primary" href="login.html?redirect=dealer.html">Customer sign in →</a></div>`;return;
    }
    if(application && application.status!=='Rejected') {
      const approved=application.status==='Approved';
      root.innerHTML=`<div class="panel" id="application-status"><span class="eyebrow">${approved?'Approved dealer':'Application submitted'}</span><h2>${approved?'Your dealer access is active.':'Your application is awaiting review.'}</h2><p style="margin:15px 0">${UI.esc(application.company)} · ${UI.esc(application.id)}</p><p class="muted">${approved?'Dealer quantity rules and prices now apply automatically to your account. Check each product before ordering.':'Admin must review your details before dealer prices are available. You can continue shopping at retail prices while waiting.'}</p>${application.reviewNote?`<div class="alert alert-info" style="margin-top:15px">Admin note: ${UI.esc(application.reviewNote)}</div>`:''}<div class="dealer-action-row"><a class="btn btn-primary" href="shop.html">${approved?'Shop with dealer access':'Continue retail shopping'}</a><button class="btn btn-outline" id="refresh-status">Check status</button></div><p class="hint" style="margin-top:15px">Submitted ${Store.formatDate(application.submittedAt,true)}${application.reviewedAt?' · Reviewed '+Store.formatDate(application.reviewedAt,true):''}</p></div>`+explainer;
      document.getElementById('refresh-status').addEventListener('click',()=>location.reload());return;
    }
    const values=application || {contact:u.name,email:u.email,phone:u.phone,address:[u.address?.line1,u.address?.postcode,u.address?.city,u.address?.state].filter(Boolean).join(', ')};
    const field=(id,label,type='text')=>`<div class="field"><label for="${id}">${label} *</label><input class="input" id="${id}" name="${id}" type="${type}" required maxlength="500" value="${UI.esc(values[id] || '')}"></div>`;
    root.innerHTML=explainer+`${application?`<div class="alert alert-info">Your previous application was declined.${application.reviewNote?' Admin note: '+UI.esc(application.reviewNote):''} You can correct your details and apply again.</div>`:''}<form class="panel" id="dealer-form"><h2>Business application</h2><p class="muted" style="margin:12px 0 22px">This browser demo does not send documents or messages to an external service. Use sample business information.</p><div class="form-grid">${field('company','Business / company name')}${field('registration','Business registration number')}${field('contact','Contact person')}${field('email','Business email','email')}${field('phone','Phone number','tel')}<div class="field"><label for="businessType">Business type *</label><select class="select" id="businessType" name="businessType" required><option value="">Select one</option>${['Retail shop','Online reseller','Workshop','Distributor','Other business'].map(v=>`<option ${values.businessType===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label for="address">Business address *</label><textarea class="textarea" id="address" name="address" required maxlength="500">${UI.esc(values.address || '')}</textarea></div><div class="field full"><label for="notes">Products and expected order quantities</label><textarea class="textarea" id="notes" name="notes" maxlength="2000" placeholder="Tell us what you plan to order and approximately how much.">${UI.esc(values.notes || '')}</textarea></div><label class="checkbox full"><input type="checkbox" id="consent" name="consent" required>I confirm these details and agree to admin reviewing this application for dealer access.</label></div><div class="dealer-action-row"><button type="submit" class="btn btn-primary">Submit application</button><a class="btn btn-outline" href="cart.html">Back to cart</a></div><p class="hint" style="margin-top:15px">Submitting does not grant dealer prices. Approval is required.</p></form>`;
    document.getElementById('dealer-form').addEventListener('submit',e=>{e.preventDefault();const fields=Object.fromEntries(new FormData(e.target));const result=Store.submitDealerApplication(fields);if(!result.ok){UI.toast(result.msg,'error');return;}renderDealer();window.scrollTo(0,0);});
  }
  window.addEventListener('storage',e=>{if(e.key===Store.storagePrefix+'dealers') location.reload();});
  renderDealer();
</script></body></html>
